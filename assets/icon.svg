<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256" shape-rendering="crispEdges">
  <!-- VibeNote: a pixel-art notepad with a soft green glow (his pick, 2026-10-30) -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>
  <!-- the glow behind it -->
  <rect x="6" y="5" width="20" height="24" rx="3" fill="#8ff0a4" opacity="0.55" filter="url(#glow)" shape-rendering="auto"/>
  <!-- outline -->
  <rect x="7" y="6" width="18" height="23" fill="#1d3b2a"/>
  <!-- page -->
  <rect x="8" y="7" width="16" height="21" fill="#dff7d2"/>
  <!-- lit top edge and shaded bottom/right -->
  <rect x="8" y="7" width="16" height="1" fill="#f4fff0"/>
  <rect x="8" y="27" width="16" height="1" fill="#b4e3a6"/>
  <rect x="23" y="8" width="1" height="19" fill="#c3ebb6"/>
  <!-- green header band -->
  <rect x="8" y="8" width="16" height="3" fill="#5fbf7a"/>
  <rect x="8" y="10" width="16" height="1" fill="#3f9a5c"/>
  <!-- binding rings -->
  <rect x="10" y="4" width="2" height="5" fill="#1d3b2a"/><rect x="10" y="5" width="1" height="3" fill="#a8f5b8"/>
  <rect x="15" y="4" width="2" height="5" fill="#1d3b2a"/><rect x="15" y="5" width="1" height="3" fill="#a8f5b8"/>
  <rect x="20" y="4" width="2" height="5" fill="#1d3b2a"/><rect x="20" y="5" width="1" height="3" fill="#a8f5b8"/>
  <!-- written lines -->
  <rect x="10" y="14" width="11" height="1" fill="#4aa866"/>
  <rect x="10" y="17" width="12" height="1" fill="#4aa866"/>
  <rect x="10" y="20" width="9" height="1" fill="#4aa866"/>
  <rect x="10" y="23" width="6" height="1" fill="#4aa866"/>
  <!-- a little glowing dot, like a firefly on the page -->
  <rect x="19" y="22" width="3" height="3" fill="#8ff0a4" opacity="0.6" filter="url(#glow)" shape-rendering="auto"/>
  <rect x="20" y="23" width="1" height="1" fill="#f4fff0"/>
</svg>
